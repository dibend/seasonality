name: Python checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m py_compile get_quotes.py visualize.py
      - name: Run offline Python tests
        run: python -m unittest discover -s tests -p 'test_python.py'
